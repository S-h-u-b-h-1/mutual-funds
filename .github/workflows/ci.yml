name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Scoped per-branch/per-PR (github.ref), not global — a new push to one PR shouldn't cancel a
# different PR's run. This exists mainly for frontend-tests: it claims real rows in the shared
# `jobs` table on the isolated Neon test branch via a Postgres advisory lock (see
# frontend/vitest.config.js, jobs/testClaimLock.js), and two overlapping full-suite runs against
# that same branch would otherwise contend for it needlessly on every superseded push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python data-quality tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # -m adds the repo root to sys.path so `ingestion` imports cleanly.
      # DATABASE_URL here is the TEST branch (same secret frontend-tests uses) — tests/test_migrations.py
      # is the ONLY file in tests/ that touches it (confirmed: it's read-only, information_schema/
      # pg_constraint/pg_indexes queries plus a couple of `select count(*)`), so this can't change any
      # other test's behavior. If the secret isn't set yet (see docs/TEST_DATABASE_AND_CI.md), that one
      # file's own pytest.mark.skipif no-ops gracefully — this job doesn't hard-fail on a missing
      # secret the way frontend-tests does, since every OTHER file in this job needs no database at all.
      - run: python -m pytest tests/ -q
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # The anon key is publishable (RLS-protected) — safe as a default.
          # Override via repo secrets of the same name if you prefer.
          # 2026-07-03: the previous fallback pointed at "autijihzocnxduipeaop" — the OLD FinPulse
          # project, deleted when this project migrated to MF-Pulse ("fffxwcpptpyjuifknayj"). CI
          # was silently building against a dead project this whole time; fixed to the real one.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://fffxwcpptpyjuifknayj.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZnh3Y3BwdHB5anVpZmtuYXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODY4OTAsImV4cCI6MjA5Nzg2Mjg5MH0.u1_fN5z4T6N8pbbH62y97LnDexYNI3dm1qbNBg4VyvU' }}

  frontend-tests:
    name: Frontend lint + test suite (isolated Neon test branch)
    runs-on: ubuntu-latest
    # Measured: a full local run of all 70 files / 506 tests took ~480s wall-clock (see
    # docs/TEST_DATABASE_AND_CI.md). This budgets ~3x that for npm ci + lint + a cold/shared
    # runner + a possible Neon compute cold-start on the test branch after CI-only idle periods.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Guard — TEST_DATABASE_URL secret present
        id: guard
        run: |
          if [ -z "${{ secrets.TEST_DATABASE_URL }}" ]; then
            echo "::warning::Cause: TEST_DATABASE_URL repo secret not set in GitHub Actions. Skipping live Neon integration tests in CI. Location: repo Settings -> Secrets and variables -> Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run test suite
        if: steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm test
