name: CI

on:
  push:
    branches: [main, codex/mf-pulse-remediation-2026-09-08]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MFPULSE_CI_DATABASE_GUARD: "1"
  # No production public-mirror reads or analytics writes from builds/browser tests.
  # CI exercises the honest unavailable-mirror state; live source checks are separate.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-unconfigured-public-mirror

# Scoped per-branch/per-PR (github.ref), not global — a new push to one PR shouldn't cancel a
# different PR's run. This exists mainly for frontend-tests: it claims real rows in the shared
# `jobs` table on the isolated Neon test branch via a Postgres advisory lock (see
# frontend/vitest.config.js, jobs/testClaimLock.js), and two overlapping full-suite runs against
# that same branch would otherwise contend for it needlessly on every superseded push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python data-quality tests
    runs-on: ubuntu-latest
    env:
      # libpq needs an explicit CA store on a fresh runner. Keep verify-full TLS;
      # use the operating system trust roots, never disable certificate checks.
      PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Require integration database
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: test -n "$TEST_DATABASE_URL" || { echo "::error::TEST_DATABASE_URL is required for schema verification"; exit 1; }
      - name: Verify connected test project and branch
        run: python -m scripts.ci_database_guard
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # -m adds the repo root to sys.path so `ingestion` imports cleanly.
      # DATABASE_URL here is the TEST branch (same secret frontend-tests uses) — tests/test_migrations.py
      # only inspects schema here. Missing credentials fail above, never silently skip this gate.
      - run: python -m pytest tests/ -q -rs
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  frontend-tests:
    name: Frontend lint + test suite (isolated Neon test branch)
    runs-on: ubuntu-latest
    # Measured: a full local run of all 70 files / 506 tests took ~480s wall-clock (see
    # docs/TEST_DATABASE_AND_CI.md). This budgets ~3x that for npm ci + lint + a cold/shared
    # runner + a possible Neon compute cold-start on the test branch after CI-only idle periods.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Guard — TEST_DATABASE_URL secret present
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::TEST_DATABASE_URL is required for integration and tenant-isolation verification."
            exit 1
          fi
      - name: Verify connected test project and branch
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/check-test-database.mjs
      - name: Run test suite
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm test

  browser-regression:
    name: Research browser regression
    # Share one isolated DB without overlapping browser writes and the integration job queue.
    needs: [backend-tests, frontend-build, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      AUTH_SECRET: ci-only-disposable-browser-session-secret
      NEXTAUTH_URL: http://localhost:3011
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: test -n "$TEST_DATABASE_URL" || { echo "::error::Missing isolated browser-test database"; exit 1; }
      - run: npm ci
      - name: Verify connected test project and branch before browser fixtures
        run: node scripts/check-test-database.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-evidence
          path: |
            output/playwright/remediation/
            frontend/test-results/
