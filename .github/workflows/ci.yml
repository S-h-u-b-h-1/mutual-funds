name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Python data-quality tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # -m adds the repo root to sys.path so `ingestion` imports cleanly
      - run: python -m pytest tests/ -q

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # The anon key is publishable (RLS-protected) — safe as a default.
          # Override via repo secrets of the same name if you prefer.
          # 2026-07-03: the previous fallback pointed at "autijihzocnxduipeaop" — the OLD FinPulse
          # project, deleted when this project migrated to MF-Pulse ("fffxwcpptpyjuifknayj"). CI
          # was silently building against a dead project this whole time; fixed to the real one.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://fffxwcpptpyjuifknayj.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZnh3Y3BwdHB5anVpZmtuYXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODY4OTAsImV4cCI6MjA5Nzg2Mjg5MH0.u1_fN5z4T6N8pbbH62y97LnDexYNI3dm1qbNBg4VyvU' }}
