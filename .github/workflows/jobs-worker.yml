# Background Job Platform worker (Phase 4 M1). One tick every 15 minutes: recover expired
# leases, enqueue due schedules, drain due jobs. Overlapping runs are safe (SKIP LOCKED +
# leases), so no concurrency cancellation is needed — but the group still prevents a pile-up
# of queued workflow runs if a tick ever runs long.
name: jobs-worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: jobs-worker
  cancel-in-progress: false

jobs:
  tick:
    name: Worker tick — reclaim, schedule, drain
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Guard — DATABASE_URL present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Cause: DATABASE_URL not set. Location: repo secrets. Fix: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Run worker tick
        working-directory: frontend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/jobs_worker_tick.mjs
