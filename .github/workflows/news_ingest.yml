name: News ingestion

on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours (UTC), all days — RBI/SEBI/global cues aren't confined to trading hours
  workflow_dispatch: {}

jobs:
  ingest:
    name: Ingest financial news → Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run news ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set — ingestion cannot run."
            echo "Add both under Settings → Secrets and variables → Actions to activate the news pipeline."
            # Fails loudly (not exit 0) on purpose: a no-op run reporting "success" is exactly how
            # this went unnoticed for this long — a completely idle pipeline should show red, not
            # a green checkmark that looks identical to a real, successful run.
            exit 1
          fi
          python -m scripts.ingest_news
