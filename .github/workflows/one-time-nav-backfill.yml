name: One-Time NAV History Backfill

# TEMPORARY, single-use workflow for the 2026-07-29 P0 NAV freshness incident (see commit history
# and docs/BACKEND_TECHNICAL_DEBT.md / the incident writeup for the full account). Not part of the
# regular pipeline -- workflow_dispatch only, no schedule. Delete this file once it has run
# successfully once; scripts/backfill_nav_history.py remains as the reusable tool for any future
# need to re-run this by hand with different parameters.
#
# Why this needs to run in GH Actions rather than locally: fetch_series()/anchor_nav() in
# build_performance.py were reordered to prefer fact_nav_daily (populated daily by cloud_pipeline)
# over AMFI's HTTP history endpoint, which GH Actions' runners currently cannot reach reliably.
# That fix alone isn't enough until fact_nav_daily has enough accumulated depth (30+ days) for the
# r1m metric assert_returns_usable gates on -- as of this incident, daily accumulation alone only
# reached ~21-26 days. This workflow runs a one-time backfill using the SAME DATABASE_URL/
# SUPABASE_* secrets the regular production-refresh.yml pipeline already has and trusts daily, so
# no credential handling outside the established secrets mechanism is needed.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to backfill"
        default: "100"
        required: false

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill fact_nav_daily
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.backfill_nav_history --days "${{ inputs.days }}"
