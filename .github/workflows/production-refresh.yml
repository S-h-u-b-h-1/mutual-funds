name: Production Refresh

# The ONE autonomous production pipeline (2026-07-04 P0 fix): AMFI -> Supabase (+ Neon mirror)
# -> static bundles -> data-quality gate -> commit -> deploy -> verify. Runs automatically every
# trading evening; workflow_dispatch stays available for on-demand/emergency runs.
#
# This replaces two broken pieces found in the go-live audit (see docs/PIPELINE_ARCHITECTURE.md):
#   1. daily-nav.yml ingested NAV on a schedule but never rebuilt bundles, committed, or deployed
#      — so fresh data reached Supabase but never reached the website. Retired (deleted), fully
#      subsumed by this workflow.
#   2. This workflow itself used to be workflow_dispatch-only and had ZERO runs, ever, since it
#      was created. Fixed by adding the schedule below.
# Also fixes: missing `permissions: contents: write` (the repo's default token is read-only, so
# the commit+push step would have failed even if triggered), steps that reported "success" while
# silently skipping real work (now hard-fail on missing required secrets), and no automatic retry
# on transient network failures.
#
# 2026-07-19: fixed a real stale-production incident — steps 6/7 used to gate on whether THIS
# run's data ingest changed the bundles, which is the wrong signal for "does production need
# re-pointing." Two workflow_dispatch runs reported overall "success" while silently skipping
# re-aliasing, leaving mf-pulse.vercel.app 4 commits behind HEAD (code pushed directly, no bundle
# diff in either run). See step 5b and docs/PRODUCTION_RELEASE_RUNBOOK.md.
on:
  schedule:
    - cron: "30 14 * * 1-6"   # 14:30 UTC = 8:00pm IST, Mon-Sat (after AMFI publishes)
    # Morning catch-up (05:00 UTC = 10:30am IST, daily): AMFI's NAVAll.txt is updated
    # progressively as AMCs upload — the evening run can catch a partially-updated file (found
    # live 2026-07-06: only ~5k of 14k schemes had Monday NAVs at 22:54 IST). NAVAll only ever
    # carries each scheme's LATEST row, so stragglers that upload overnight would leave permanent
    # holes in fact_nav_daily's history without this second pass. Idempotent: no new data → no
    # bundle change → no commit/deploy.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # required for step 5's git push — repo default is read-only

jobs:
  refresh:
    name: Full refresh — ingest, rebuild, deploy, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 0. Download today's AMFI file ONCE — shared by ingestion and bundle rebuild
        run: |
          # A single download shared by every later step: AMFI updates NAVAll.txt progressively
          # through the evening, so separate downloads minutes apart can catch different
          # snapshots, leaving the warehouse and the site bundles disagreeing about the same run.
          for attempt in 1 2; do
            curl -sL --fail "https://portal.amfiindia.com/spages/NAVAll.txt" -o data/NAVAll.txt && exit 0
            echo "::warning::AMFI download attempt $attempt failed."
            [ "$attempt" = "1" ] && { echo "Retrying in 15s..."; sleep 15; }
          done
          echo "::error::Cause: portal.amfiindia.com unreachable or the NAVAll.txt path changed. Location: this step. Fix: verify the URL resolves manually; check AMFI's own status page."
          exit 1

      - name: 1. Ingest AMFI NAV → Supabase + Neon (refreshes materialized views) — critical, retried once
        id: nav
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAVALL_PATH: data/NAVAll.txt
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Cause: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set. Location: repo secrets. Fix: Settings -> Secrets and variables -> Actions -> add both."
            exit 1
          fi
          for attempt in 1 2; do
            if python -m scripts.cloud_pipeline; then
              echo "ran=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::NAV ingestion attempt $attempt failed."
            [ "$attempt" = "1" ] && { echo "Retrying in 15s..."; sleep 15; }
          done
          echo "::error::Cause: scripts.cloud_pipeline failed twice in a row (see output above). Location: scripts/cloud_pipeline.py. Fix: check AMFI reachability and Supabase credential validity."
          exit 1

      - name: 2. Ingest financial news → Supabase — non-critical, logged not fatal
        id: news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Cause: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set. Not fatal — /news reads Supabase live and simply won't show new articles until this is added."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python -m scripts.ingest_news; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cause: scripts.ingest_news failed (see output above). Location: scripts/ingest_news.py. Non-fatal — continuing to bundle rebuild; today's news simply won't be reflected."
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. Rebuild static bundles (funds.json, performance.json, daily.json) — critical
        id: bundles
        run: |
          # data/NAVAll.txt was downloaded once in step 0 — the same snapshot step 1 ingested.
          python -m scripts.build_performance
          python -m scripts.build_daily
          # Institutional Mission 1: refreshes frontend/app/data/fieldCoverage.json (the live
          # /internal/data-completeness dashboard's data source) from the funds.json/metadata.json
          # just rebuilt above. Folded into this step (not its own) so the "changed" diff below
          # correctly covers it too. Non-critical: it does its own redundant live-AMFI fetch for
          # the scheme-level diff, so a network blip here must never fail the NAV pipeline that
          # already succeeded above.
          python -m scripts.market_coverage_audit || echo "::warning::market_coverage_audit failed — fieldCoverage.json/data/warehouse not refreshed this run, last-known copies stay committed"
          # data/warehouse/*.json (production_validation.json, coverage_dashboard.json, etc.) must
          # be diffed and committed alongside the frontend bundles — Completion Sprint Phase 2 gap
          # found 2026-07-23: this audit ran here and gated step 4 fine (fresh, snapshot-matched),
          # but its output was never committed, so ci.yml's bare `pytest tests/ -q` (no regen step)
          # kept checking a copy frozen since 2026-07-19, which drifted into a false "orphan funds"
          # failure with zero relation to any real code/data change. See docs/DATA_COVERAGE_MATRIX.md.
          if git diff --quiet -- frontend/app/data/ data/warehouse/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in rebuilt bundles vs the committed copy — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 4. Data-quality gate (must pass before anything is committed/deployed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pytest tests/ -q

      - name: 4b. Live data guarantee — assert the NAV → analytics → JSON chain is actually caught up
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.assert_pipeline_freshness

      - name: 5. Commit refreshed bundles
        id: commit
        if: steps.bundles.outputs.changed == 'true'
        run: |
          git config user.name "mfpulse-bot"
          git config user.email "bot@mfpulse.local"
          git add frontend/app/data/funds.json frontend/app/data/performance.json frontend/app/data/daily.json frontend/app/data/fieldCoverage.json data/warehouse/
          git commit -m "chore(refresh): production data refresh $(date -u +%Y-%m-%d)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: 5b. Determine whether production needs re-pointing
        id: staleness
        run: |
          # Real incident, 2026-07-19: steps 6/7 used to gate on `bundles.changed` alone. That's
          # the wrong signal — it's only true when THIS run's ingest produced a new data commit,
          # so it silently skipped re-aliasing whenever HEAD moved for any other reason (e.g. a
          # direct `git push` of code + workflow_dispatch to deploy it). Two full runs reported
          # "success" while steps 5-7 all showed "skipped" — a passing state, not a failure — and
          # mf-pulse.vercel.app kept serving a commit 4 pushes behind HEAD. Caught only by
          # manually cross-checking /api/freshness's deployedCommitSha against `git log`.
          # Fix: compare production's ACTUAL currently-served commit (not an assumption derived
          # from this run's own diff) against this run's HEAD. Re-point if they differ, or if
          # step 5 is about to move HEAD forward by committing new bundles. Fails OPEN (assumes
          # re-pointing is needed) if production is unreachable, since an unnecessary re-alias is
          # harmless but a silently-skipped necessary one is exactly this incident.
          HEAD_SHA=$(git rev-parse HEAD)
          LIVE_SHA=$(curl -sL --max-time 15 https://mf-pulse.vercel.app/api/freshness | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deployedCommitSha") or "")' 2>/dev/null || echo "")
          echo "HEAD=$HEAD_SHA  production currently serves=${LIVE_SHA:-<unreachable>}"
          if [ "${{ steps.bundles.outputs.changed }}" = "true" ] || [ -z "$LIVE_SHA" ] || [ "$LIVE_SHA" != "$HEAD_SHA" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.bundles.outputs.changed }}" = "true" ]; then REASON="bundles changed this run"
            elif [ -z "$LIVE_SHA" ]; then REASON="could not reach production to compare (failing open)"
            else REASON="production is on a different commit than HEAD"; fi
            echo "Re-pointing needed: $REASON"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Production already serves HEAD ($HEAD_SHA) — nothing to re-point."
          fi

      - name: 6. Point mf-pulse.vercel.app at this refresh's deployment
        id: deploy
        if: steps.staleness.outputs.needed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # The domain does NOT auto-follow new production deployments on this project (root
          # cause of the 2026-07-04..06 stale-production incident — see docs/PIPELINE_ARCHITECTURE.md).
          # Primary path: step 5's push already triggers Vercel's git-integration build, so we
          # only wait for THAT deployment (matched by commit SHA, never "latest") to be READY and
          # alias the domain to it. Fallback path: if the git deployment never appears (git
          # integration broken again), do a full CLI deploy ourselves, then alias that instead.
          # Verify secret access BEFORE attempting anything — a present-but-wrong token/org/
          # project ID must fail here with a specific reason, not surface as a confusing error
          # three API calls later. Never prints secret values, only names and API responses.
          #
          # Every python heredoc in this step is run through textwrap.dedent — bash heredocs
          # preserve the YAML block's leading indentation verbatim, and Python's parser rejects
          # an indented first line (IndentationError: unexpected indent) no matter how
          # internally consistent that indentation is. This went undetected until 2026-07-11
          # because every prior run had a missing VERCEL_TOKEN, which short-circuited before
          # any of these heredocs ever actually executed — confirmed by extracting and running
          # the raw heredoc bytes directly, reproducing the exact error.
          python3 -c '
          import sys, textwrap
          exec(compile(textwrap.dedent(sys.stdin.read()), "<step6-verify>", "exec"))
          ' <<'PY'
          import json, os, sys, urllib.error, urllib.request
          token = os.environ.get("VERCEL_TOKEN", "")
          org_id = os.environ.get("VERCEL_ORG_ID", "")
          project_id = os.environ.get("VERCEL_PROJECT_ID", "")
          missing = [n for n, v in [("VERCEL_TOKEN", token), ("VERCEL_ORG_ID", org_id), ("VERCEL_PROJECT_ID", project_id)] if not v]
          if missing:
              print(f"::error::Missing repo secret(s): {', '.join(missing)}. Cannot re-point mf-pulse.vercel.app — "
                    f"the git-integration deploy still happens, but the domain will keep serving whatever it was "
                    f"last manually aliased to, no matter how many successful refreshes run behind it. "
                    f"Location: repo secrets (Settings -> Secrets and variables -> Actions). "
                    f"Fix: add the missing secret(s), generated from a Vercel account token with access to this project.",
                    file=sys.stderr)
              sys.exit(1)

          def vercel_get(path):
              req = urllib.request.Request(f"https://api.vercel.com{path}", headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read() or b"{}")
                  except json.JSONDecodeError:
                      return e.code, {}

          status, body = vercel_get(f"/v9/projects/{project_id}?teamId={org_id}")
          if status != 200:
              print(f"::error::VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID invalid — GET /v9/projects/{{id}} "
                    f"returned {status}: {body.get('error', {}).get('message', body)}. "
                    f"Cause: the token lacks access to this project, or VERCEL_ORG_ID/VERCEL_PROJECT_ID is wrong. "
                    f"Location: repo secrets. Fix: regenerate a token scoped to this team/project and verify the "
                    f"IDs in the Vercel dashboard -> project Settings -> General.", file=sys.stderr)
              sys.exit(1)
          print(f"Vercel project resolved: {body.get('name')} (id {project_id[:12]}...)", file=sys.stderr)

          status, body = vercel_get(f"/v9/projects/{project_id}/domains?teamId={org_id}")
          domains = [d.get("name") for d in body.get("domains", [])] if status == 200 else []
          if "mf-pulse.vercel.app" not in domains:
              print(f"::error::mf-pulse.vercel.app is not attached to project {project_id} "
                    f"(domains on this project: {domains or 'none / lookup failed'}). "
                    f"Cause: VERCEL_PROJECT_ID points to the wrong project, or the domain moved. "
                    f"Location: Vercel dashboard -> project Settings -> Domains. "
                    f"Fix: verify VERCEL_PROJECT_ID matches the project that owns mf-pulse.vercel.app.", file=sys.stderr)
              sys.exit(1)
          print("Vercel secret access verified: token authenticates, project resolves, mf-pulse.vercel.app is attached.", file=sys.stderr)
          PY
          SHA=$(git rev-parse HEAD)
          echo "Waiting for the git-integration deployment of $SHA to be READY..."
          DEPLOY_UID=$(python3 -c '
          import sys, textwrap
          exec(compile(textwrap.dedent(sys.stdin.read()), "<step6-lookup>", "exec"))
          ' "$SHA" <<'PY'
          import json, os, sys, time, urllib.request
          sha, token = sys.argv[1], os.environ["VERCEL_TOKEN"]
          base = (f"https://api.vercel.com/v6/deployments?projectId={os.environ['VERCEL_PROJECT_ID']}"
                  f"&teamId={os.environ['VERCEL_ORG_ID']}&target=production&limit=20")
          for attempt in range(10):  # ~5 minutes
              req = urllib.request.Request(base, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  deployments = json.loads(r.read()).get("deployments", [])
              for d in deployments:
                  if d.get("meta", {}).get("githubCommitSha") == sha:
                      state = d.get("readyState") or d.get("state")
                      print(f"attempt {attempt+1}: found {d['uid']} state={state}", file=sys.stderr)
                      if state == "READY":
                          print(d["uid"]); sys.exit(0)
                      if state in ("ERROR", "CANCELED"):
                          print(f"git deployment for {sha} ended {state}", file=sys.stderr); sys.exit(2)
                      break
              else:
                  print(f"attempt {attempt+1}: no deployment for {sha} yet", file=sys.stderr)
              time.sleep(30)
          sys.exit(3)  # timed out — trigger the fallback deploy below
          PY
          ) || FALLBACK=$?
          if [ -n "${FALLBACK:-}" ]; then
            echo "::warning::Git-integration deployment not READY after ~5min (exit $FALLBACK) — falling back to a direct CLI deploy."
            cd frontend
            npm ci
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx vercel build --prod --token="$VERCEL_TOKEN"
            DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
            echo "Fallback deployed: $DEPLOY_URL"
            npx vercel alias set "$DEPLOY_URL" mf-pulse.vercel.app --token="$VERCEL_TOKEN"
            exit 0
          fi
          echo "Aliasing mf-pulse.vercel.app -> deployment $DEPLOY_UID"
          python3 -c '
          import sys, textwrap
          exec(compile(textwrap.dedent(sys.stdin.read()), "<step6-alias>", "exec"))
          ' "$DEPLOY_UID" <<'PY'
          import json, os, sys, urllib.error, urllib.request
          uid, token = sys.argv[1], os.environ["VERCEL_TOKEN"]
          url = f"https://api.vercel.com/v2/deployments/{uid}/aliases?teamId={os.environ['VERCEL_ORG_ID']}"
          req = urllib.request.Request(url, data=json.dumps({"alias": "mf-pulse.vercel.app"}).encode(),
                                       headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                                       method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"alias response: {r.status} {r.read().decode()[:300]}", file=sys.stderr)
          except urllib.error.HTTPError as e:
              body = e.read().decode()[:500]
              print(f"::error::Aliasing mf-pulse.vercel.app -> {uid} failed: HTTP {e.code} {body}. "
                    f"Cause: the Vercel API rejected the alias request. Location: Vercel API "
                    f"(/v2/deployments/{{id}}/aliases). Fix: check the deployment {uid} still exists "
                    f"and VERCEL_TOKEN has alias permission on this project.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: 7. Verify production actually reflects the refresh
        run: |
          # Unconditional by design (not gated on step 6 running) — this is the standing
          # assertion that production actually matches HEAD, regardless of why. If step 6 ran,
          # give propagation time; if it was skipped because production was already correct,
          # skip the wait and confirm immediately. Either way this step is the real backstop: if
          # step 5b's staleness check itself ever has a bug, this still catches a stale domain
          # and fails the job loudly instead of a workflow silently reporting "success".
          WAIT=0
          [ "${{ steps.staleness.outputs.needed }}" = "true" ] && WAIT=75
          python -m scripts.verify_public_domain_freshness \
            --expected-sha "$(git rev-parse HEAD)" \
            --initial-wait "$WAIT" --retries 5 --wait 45

      - name: Summary
        if: always()
        run: |
          echo "## Production Refresh Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            echo "- **PUBLIC DOMAIN: STALE — step 6 (Vercel secret verification or aliasing) failed.** mf-pulse.vercel.app was NOT touched this run. See that step's log for the exact cause." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- NAV → Supabase/Neon: ${{ steps.nav.outputs.ran || 'FAILED' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- News → Supabase: ${{ steps.news.outputs.ran || 'failed (non-fatal)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundles changed: ${{ steps.bundles.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Committed + pushed: ${{ steps.commit.outputs.pushed || 'no changes to commit' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production re-pointing needed: ${{ steps.staleness.outputs.needed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production verified fresh: see 'Verify production actually reflects the refresh' step above (runs every time, hard-fails the job on mismatch)" >> "$GITHUB_STEP_SUMMARY"
