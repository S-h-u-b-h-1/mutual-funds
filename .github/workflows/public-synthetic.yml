name: Public research synthetic checks
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: public-research-synthetic
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: https://mf-pulse.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Read-only public paths and unauthenticated denial only. No production test users.
      - run: npx playwright test e2e/research.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-synthetic-failure
          path: |
            output/playwright/remediation/
            frontend/test-results/
